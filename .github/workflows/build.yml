name: build

# Compile le plugin, lance les validateurs (validateJson, checkSystemRegistrations, validateRoles, validateAssets :
# tous branchés sur `check`) et publie le jar du mod en artefact.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build (compile, validateurs, jar)
        run: ./gradlew build --no-daemon
      # Le jar s'extrait du zip téléchargé et se dépose tel quel dans le dossier mods/ d'une save ou d'un serveur.
      - uses: actions/upload-artifact@v6
        with:
          name: Nakasar-Peuples
          path: build/libs/Nakasar-Peuples-*.jar
          if-no-files-found: error
